# 冒烟测试使用独立内存 H2,不占用运行时文件数据库。
spring:
  datasource:
    url: jdbc:h2:mem:erupt-crm-test;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE,VALUE_
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

erupt:
  app-name: Erupt Pro 

logging:
  level:
    root: WARN
    xyz.erupt: WARN
    org.hibernate.SQL: WARN
