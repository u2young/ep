# 资产管理模块冒烟测试: 独立内存 H2, 扫描 ast+fin(折旧 GL 过账集成)
spring:
  datasource:
    url: jdbc:h2:mem:ast-test;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE,VALUE_
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

erupt:
  app-name: Ast Test

logging:
  level:
    root: WARN
    xyz.erupt: WARN
    org.hibernate.SQL: WARN
