# 服务支持模块冒烟测试: 独立内存 H2, 扫描 sup+crm(CrmCustomer REF 关联)
spring:
  datasource:
    url: jdbc:h2:mem:sup-test;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE,VALUE_
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

erupt:
  app-name: Sup Test

logging:
  level:
    root: WARN
    xyz.erupt: WARN
    org.hibernate.SQL: WARN
