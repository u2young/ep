# 人力资源模块冒烟测试: 独立内存 H2, 仅扫描 hr 包(无跨模块依赖)
spring:
  datasource:
    url: jdbc:h2:mem:hr-test;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE,VALUE_
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

erupt:
  app-name: HR Test

logging:
  level:
    root: WARN
    xyz.erupt: WARN
    org.hibernate.SQL: WARN
